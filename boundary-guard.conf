# boundary-guard.conf for ragfit-runner-images (public).
# The repository holds only image sources, their CI and the repository stamp.

allow-path images/*
allow-path .github/*
allow-path images.lock
allow-path README.md
allow-path LICENSE
allow-path NOTICE
allow-path scripts/*
# repository stamp
allow-path AGENTS.md
allow-path erynoa.md
allow-path justfile
allow-path flake.nix
allow-path growth-budget.toml
allow-path .pre-commit-config.yaml
allow-path .gitignore
allow-path docs/decisions/*
allow-path docs/work/*
allow-path tests/*

# private and CGNAT addresses, tailnet names
deny-content [A-Za-z0-9-]+\.ts\.net
deny-content \b100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}\b
deny-content \b10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\b
deny-content \b192\.168\.[0-9]{1,3}\.[0-9]{1,3}\b
deny-content \b172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}\b
deny-content \bfd[0-9a-fA-F]{2}:[0-9a-fA-F]{0,4}:
deny-content \b[A-Za-z0-9-]+\.(internal|lan|local|home\.arpa)\b
# e-mail addresses and mentions
deny-content [A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}
deny-content (^|[^[:space:]][[:space:]]+|\()@[A-Za-z0-9][A-Za-z0-9-]*
# names of private repositories, internal hosts and internal tooling are NOT listed here
# (this repository is public). They come from the CI secret BOUNDARY_GUARD_EXTRA.
require-extra
# absolute home and work paths
deny-content (^|[^A-Za-z0-9])/(home|Users|workspace|root)/[A-Za-z0-9._-]+
# secrets
deny-content -----BEGIN [A-Z ]*PRIVATE KEY-----
deny-content BEGIN ENCRYPTED (SIGSTORE|COSIGN) PRIVATE KEY
deny-content AGE-SECRET-KEY-1[0-9A-Z]+
deny-content gh[pousr]_[A-Za-z0-9]{30,}
deny-content github_pat_[A-Za-z0-9_]{20,}
deny-content \bAKIA[0-9A-Z]{16}\b
